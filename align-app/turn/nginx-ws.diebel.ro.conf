# ⚠️ DEPRECATED — nu folosi acest fișier pe VPS.
# Trimitea tot traficul la port 3000 (Next) → /health ajunge la Vercel/404.
# Folosește: nginx-ws.diebel.ro.conf.example (/health + /ws → 4001)
# Ghid: docs/VPS-nginx-ws-conflict-FIX.md

server {
    listen 80;
    server_name ws.diebel.ro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ws.diebel.ro;

    ssl_certificate /etc/letsencrypt/live/ws.diebel.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.diebel.ro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
