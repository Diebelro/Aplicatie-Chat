# ----------------------------------------------------------------------------
# Diebel — stack producție pe VPS (fără Vercel, fără Caddy)
#   app       : Next.js (chat.diebel.ro)            — pornește IMPLICIT
#   signaling : WebSocket WebRTC (ws.diebel.ro/ws)  — doar cu profilul "standalone"
#
# HTTPS + reverse proxy sunt asigurate de nginx-ul existent de pe VPS (nu de acest
# compose). nginx face proxy: chat.diebel.ro -> 127.0.0.1:<port app> (vezi
# docker-compose.override.yml), iar ws.diebel.ro -> serverul de signaling.
#
#   docker compose up -d --build      # pornește doar `app`
#
# Dacă rulezi signaling în container (server fără serviciul systemd):
#   docker compose --profile standalone up -d --build
#
# coturn (TURN/STUN) rămâne separat pe VPS (turn.diebel.ro), nu în acest compose.
# Baza de date Postgres rulează ca serviciu Docker pe același VPS.
# ----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: diebel
      # Parola vine din fișierul `.env` de lângă compose (gitignored): POSTGRES_PASSWORD=...
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Setează POSTGRES_PASSWORD în align-app/.env}
      POSTGRES_DB: diebel_chat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXTAUTH_URL: https://chat.diebel.ro
        NEXT_PUBLIC_APP_URL: https://chat.diebel.ro
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-unknown}
    image: diebel-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Pozele din chat se salvează pe disc (volum), nu pe Vercel Blob.
      CHAT_LOCAL_UPLOAD: "true"
    volumes:
      - chat_uploads:/app/public/_chatDev
    depends_on:
      - postgres
    expose:
      - "3000"

  signaling:
    profiles: ["standalone"]
    build:
      context: .
      dockerfile: Dockerfile.signaling
    image: diebel-signaling:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      SIGNALING_PORT: "4001"
      SIGNALING_BIND_ADDRESS: 0.0.0.0
    expose:
      - "4001"

volumes:
  chat_uploads:
  postgres_data:
