# =============================================================================
# DOAR pentru prima instalare / certbot (fără certificat încă)
# =============================================================================
# 1. Copiază ca sites-available/chat.diebel.ro, nginx -t, reload
# 2. rulează: sudo certbot certonly --webroot -w /var/www/html -d chat.diebel.ro
#    SAU: certbot --nginx -d chat.diebel.ro
# 3. Înlocuiește acest fișier cu nginx-chat.diebel.ro.conf (HTTPS complet)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name chat.diebel.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
