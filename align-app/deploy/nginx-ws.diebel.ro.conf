# =============================================================================
# ws.diebel.ro — WSS → http://127.0.0.1:4001/ws  |  GET /health → Node /health
# =============================================================================
# map $http_upgrade $connection_upgrade: ONLY in /etc/nginx/conf.d/ws-connection-map.conf
# (repo: nginx-ws-connection-map.conf). This file must NOT contain map{}.
#
# Install on server: see ws-diebel-nginx-server-commands.txt in this folder.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ws.diebel.ro;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ws.diebel.ro;

    ssl_certificate     /etc/letsencrypt/live/ws.diebel.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.diebel.ro/privkey.pem;

    # Certbot-generated TLS hardening (Debian/Ubuntu) — create with: certbot --nginx
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # If this path is missing: sudo certbot renew --dry-run (often creates it) or comment out.
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/ws.diebel.ro/chain.pem;

    server_tokens off;

    # Align with signaling payload limits (e.g. SIGNALING_MAX_MSG_BYTES)
    client_max_body_size 128k;
    client_body_timeout  15s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Health (HTTP to Node — no WebSocket)
    location = /health {
        proxy_pass http://127.0.0.1:4001/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        proxy_buffering off;
    }

    # WebSocket signaling: wss://ws.diebel.ro/ws?token=...
    location /ws {
        proxy_pass http://127.0.0.1:4001/ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering          off;
        proxy_request_buffering  off;

        proxy_connect_timeout    60s;
        proxy_read_timeout       86400s;
        proxy_send_timeout       86400s;
    }

    location / {
        return 404;
    }
}
