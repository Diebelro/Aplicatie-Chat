# =============================================================================
# chat.diebel.ro — Nginx → Next.js (Docker pe 127.0.0.1:3002)
# =============================================================================
# Copiază în /etc/nginx/sites-available/chat.diebel.ro și symlink în sites-enabled.
# Înlocuiește căile SSL cu cele de la certbot: /etc/letsencrypt/live/chat.diebel.ro/
#
# sudo nginx -t && sudo systemctl reload nginx
# Pe VPS: bash scripts/vps-apply-nginx.sh (după git pull)
# =============================================================================

upstream diebel_app {
    server 127.0.0.1:3002;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 75s;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.diebel.ro;
    location / {
        return 301 https://chat.diebel.ro$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.diebel.ro;

    # Compresie Gzip pentru JS/CSS/JSON (reducere 60-80% din payload)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript application/json application/xml
        text/css text/javascript text/plain text/xml
        image/svg+xml font/woff font/woff2;

    # Buffer proxy optimizat
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    proxy_busy_buffers_size 16k;

    ssl_certificate     /etc/letsencrypt/live/chat.diebel.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.diebel.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/chat.diebel.ro.access.log;
    error_log  /var/log/nginx/chat.diebel.ro.error.log;

    # Next.js hashed assets — cache lung (numele conține hash)
    location /_next/static/ {
        proxy_pass http://diebel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Avatare default + manifest + brand — schimbă rar
    location ~ ^/(avatars/|brand/|favicon\.ico|manifest\.json|manifest\.webmanifest|robots\.txt|apple-touch-icon) {
        proxy_pass http://diebel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        access_log off;
    }

    # IAB ads.txt (web AdSense) + app-ads.txt (Play / AdMob)
    location = /ads.txt {
        alias /var/www/diebel-ads/ads.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        access_log off;
    }
    location = /app-ads.txt {
        alias /var/www/diebel-ads/app-ads.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        access_log off;
    }

    # APK instalare directă (nu prin WhatsApp — fișier static, fără proxy)
    location = /download/diebel.apk {
        alias /var/www/diebel-download/diebel.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="diebel.apk"' always;
        add_header Cache-Control "public, max-age=300" always;
        access_log off;
    }

    # API dinamic — nu cache
    location /api/ {
        proxy_pass http://diebel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "private, no-store, max-age=0" always;
        proxy_read_timeout 120;
    }

    # App HTML / RSC — dinamic
    location / {
        proxy_pass http://diebel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        # Security + performance headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
