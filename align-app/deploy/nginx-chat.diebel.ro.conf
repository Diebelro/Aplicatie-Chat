# =============================================================================
# chat.diebel.ro — Nginx → Next.js (next start pe 127.0.0.1:3000)
# =============================================================================
# Copiază în /etc/nginx/sites-available/chat.diebel.ro și symlink în sites-enabled.
# Înlocuiește căile SSL cu cele de la certbot: /etc/letsencrypt/live/chat.diebel.ro/
#
# sudo nginx -t && sudo systemctl reload nginx
#
# Dacă primești 502: Next NU rulează sau NU ascultă pe 3000 — vezi deploy/FIX-502-CHAT-DIEBEL.md
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chat.diebel.ro;
    location / {
        return 301 https://chat.diebel.ro$request_uri;
    }
}

# Opțional: www → apex (șterge dacă nu folosești www în DNS)
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name www.chat.diebel.ro;
#     ssl_certificate     /etc/letsencrypt/live/chat.diebel.ro/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/chat.diebel.ro/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     return 301 https://chat.diebel.ro$request_uri;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.diebel.ro;

    ssl_certificate     /etc/letsencrypt/live/chat.diebel.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.diebel.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Loguri (opțional)
    access_log /var/log/nginx/chat.diebel.ro.access.log;
    error_log  /var/log/nginx/chat.diebel.ro.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
