# Nginx config for chat.diebel.ro (proxy to Next.js on port 3000)
# Copy or merge into /etc/nginx/sites-available/chat.diebel.ro on the server.
# Then: sudo nginx -t && sudo systemctl restart nginx

server {
    listen 80;
    listen [::]:80;
    server_name chat.diebel.ro;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
