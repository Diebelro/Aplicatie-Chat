# =============================================================================
# chat.diebel.ro — Nginx → Next.js (Docker pe 127.0.0.1:3002)
# =============================================================================
# Copiază în /etc/nginx/sites-available/chat.diebel.ro și symlink în sites-enabled.
# Înlocuiește căile SSL cu cele de la certbot: /etc/letsencrypt/live/chat.diebel.ro/
#
# sudo nginx -t && sudo systemctl reload nginx
# Pe VPS: bash scripts/vps-apply-nginx.sh (după git pull)
# =============================================================================

upstream diebel_app {
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.diebel.ro;
    location / {
        return 301 https://chat.diebel.ro$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.diebel.ro;

    ssl_certificate     /etc/letsencrypt/live/chat.diebel.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.diebel.ro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/chat.diebel.ro.access.log;
    error_log  /var/log/nginx/chat.diebel.ro.error.log;

    # Next.js hashed assets — cache lung (numele conține hash)
    location /_next/static/ {
        proxy_pass http://diebel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Avatare default + manifest — schimbă rar
    location ~ ^/(avatars/|favicon\.ico|manifest\.webmanifest|robots\.txt) {
        proxy_pass http://diebel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # API dinamic — nu cache
    location /api/ {
        proxy_pass http://diebel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "private, no-store, max-age=0" always;
        proxy_read_timeout 120;
    }

    # App HTML / RSC — dinamic
    location / {
        proxy_pass http://diebel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
}
