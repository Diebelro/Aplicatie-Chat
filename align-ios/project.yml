# Generare proiect Xcode:
#   brew install xcodegen
#   cd align-ios && xcodegen generate
#   open Diebel.xcodeproj
#
# Apoi în Xcode → target Diebel → Signing & Capabilities: alege Team,
# adaugă „Push Notifications" și „Background Modes" (Voice over IP + Audio).
name: Diebel
options:
  bundleIdPrefix: ro.diebel
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  Diebel:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    # Info.plist / entitlements sunt scrise de mână și referite prin build settings.
    # NU folosim cheile `info:` / `entitlements:` — XcodeGen le-ar regenera peste ele.
    sources:
      - path: Diebel
        excludes:
          - "**/*.md"
          - "Info.plist"
          - "Diebel.entitlements"
    settings:
      base:
        PRODUCT_NAME: Diebel
        PRODUCT_BUNDLE_IDENTIFIER: ro.diebel.chatapp
        INFOPLIST_FILE: Diebel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Diebel/Diebel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ENABLE_BITCODE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
